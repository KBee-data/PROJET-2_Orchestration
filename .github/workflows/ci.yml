name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  api-test-and-lint:
    name: API Linting & Tests (Coverage >80%)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install API dependencies
        working-directory: app_api
        run: uv sync

      - name: Lint API with Ruff
        working-directory: app_api
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Pytest with Coverage
        working-directory: app_api
        run: uv run pytest


  front-lint:
    name: Frontend Linting (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Streamlit dependencies
        working-directory: app_front
        run: uv sync

      - name: Lint Frontend with Ruff
        working-directory: app_front
        run: |
          uv run ruff check .
          uv run ruff format --check .


  docker-build-check:
    name: Validate Multi-Stage Docker Builds
    needs: [api-test-and-lint, front-lint]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app_api
          push: false
          tags: sidora-api:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app_front
          push: false
          tags: sidora-front:test

