name: CD

on:
  workflow_run:
    workflows: ["CI"]   # Perfectly matches 'name: CI' in ci.yml
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./app_api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-api:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./app_front
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-front:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-front:${{ github.sha }}

